name: 更新影视数据

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 5 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 抓取豆瓣数据并更新 movies.json
        run: node scripts/fetch.mjs
      - name: 提交更新（如有变化）
        run: |
          git config user.name "lanbo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/movies.json
          git diff --staged --quiet || git commit -m "chore: 更新影视数据"
          git push
